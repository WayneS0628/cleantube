
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#app {
  min-height: 100vh;
  background: #0f0f0f;
  color: #e0e0e0;
  font-family: var(--font-sans);
  padding: 2rem 1.5rem;
}
#search-wrap {
  display: flex;
  gap: 8px;
  max-width: 640px;
  margin: 0 auto 2rem;
}
#search-input {
  flex: 1;
  background: #1a1a1a;
  border: 0.5px solid #333;
  border-radius: var(--border-radius-md);
  color: #e0e0e0;
  font-size: 15px;
  padding: 10px 14px;
  outline: none;
}
#search-input:focus { border-color: #555; }
#search-btn {
  background: #1a1a1a;
  border: 0.5px solid #333;
  border-radius: var(--border-radius-md);
  color: #e0e0e0;
  padding: 10px 18px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#search-btn:hover { background: #252525; border-color: #555; }
#player-section {
  display: none;
  max-width: 900px;
  margin: 0 auto 2rem;
}
#back-btn {
  background: transparent;
  border: 0.5px solid #333;
  border-radius: var(--border-radius-md);
  color: #aaa;
  font-size: 13px;
  padding: 6px 14px;
  cursor: pointer;
  margin-bottom: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#back-btn:hover { border-color: #555; color: #e0e0e0; }
#player-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
}
#yt-player {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
#player-error {
  display: none;
  position: absolute;
  inset: 0;
  background: #111;
  border-radius: var(--border-radius-lg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 2rem;
}
#player-error p {
  color: #888;
  font-size: 14px;
}
#open-yt-btn {
  background: #cc0000;
  border: none;
  border-radius: var(--border-radius-md);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
#open-yt-btn:hover { background: #aa0000; }
#video-title {
  font-size: 15px;
  font-weight: 500;
  color: #e0e0e0;
  margin-top: 12px;
  line-height: 1.4;
}
#results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
}
.result-card {
  background: #1a1a1a;
  border: 0.5px solid #2a2a2a;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
}
.result-card:hover { border-color: #444; }
.result-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
}
.result-info { padding: 10px 12px; }
.result-title {
  font-size: 13px;
  font-weight: 500;
  color: #e0e0e0;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.result-meta { font-size: 12px; color: #777; }
#status {
  text-align: center;
  color: #555;
  font-size: 14px;
  padding: 3rem 0;
}
#load-more-wrap { text-align: center; margin-top: 1.5rem; }
#load-more {
  display: none;
  background: #1a1a1a;
  border: 0.5px solid #333;
  border-radius: var(--border-radius-md);
  color: #aaa;
  font-size: 13px;
  padding: 8px 24px;
  cursor: pointer;
}
#load-more:hover { border-color: #555; color: #e0e0e0; }
</style>

<div id="app">
  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Search YouTube..." autocomplete="off" />
    <button id="search-btn"><i class="ti ti-search" aria-hidden="true"></i> Search</button>
  </div>

  <div id="player-section">
    <button id="back-btn"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to results</button>
    <div id="player-container">
      <iframe id="yt-player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      <div id="player-error">
        <i class="ti ti-player-play" style="font-size:32px; color:#555;" aria-hidden="true"></i>
        <p>This video can't be embedded — the creator has disabled it.<br>Open it on YouTube instead.</p>
        <button id="open-yt-btn"><i class="ti ti-brand-youtube" aria-hidden="true"></i> Open on YouTube</button>
      </div>
    </div>
    <div id="video-title"></div>
  </div>

  <div id="results"></div>
  <div id="load-more-wrap"><button id="load-more">Load more</button></div>
  <div id="status">Search for anything above.</div>
</div>

<script>
const API_KEY = 'AIzaSyDuJ8aCjywFztJkT9g6GumsByOFsfaezs8';
let nextPageToken = '';
let currentQuery = '';
let currentVideoId = '';

const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');
const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
const playerSection = document.getElementById('player-section');
const ytPlayer = document.getElementById('yt-player');
const playerError = document.getElementById('player-error');
const videoTitleEl = document.getElementById('video-title');
const backBtn = document.getElementById('back-btn');
const loadMoreBtn = document.getElementById('load-more');
const openYtBtn = document.getElementById('open-yt-btn');

async function search(query, pageToken = '') {
  statusEl.textContent = 'Searching...';
  if (!pageToken) resultsEl.innerHTML = '';
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&order=relevance&q=${encodeURIComponent(query)}${pageToken ? '&pageToken=' + pageToken : ''}&key=${API_KEY}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) { statusEl.textContent = 'API error: ' + data.error.message; return; }
    nextPageToken = data.nextPageToken || '';
    statusEl.textContent = '';
    renderResults(data.items || []);
    loadMoreBtn.style.display = nextPageToken ? 'inline-block' : 'none';
  } catch(e) {
    statusEl.textContent = 'Something went wrong.';
  }
}

function renderResults(items) {
  items.forEach(item => {
    const id = item.id.videoId;
    const title = item.snippet.title;
    const channel = item.snippet.channelTitle;
    const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<img src="${thumb}" alt="" loading="lazy"><div class="result-info"><div class="result-title">${title}</div><div class="result-meta">${channel}</div></div>`;
    card.addEventListener('click', () => playVideo(id, title));
    resultsEl.appendChild(card);
  });
}

function playVideo(id, title) {
  currentVideoId = id;
  playerError.style.display = 'none';
  ytPlayer.style.display = 'block';
  ytPlayer.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
  videoTitleEl.textContent = title;
  playerSection.style.display = 'block';
  resultsEl.style.display = 'none';
  document.getElementById('load-more-wrap').style.display = 'none';
  statusEl.textContent = '';
  window.scrollTo(0, 0);

  ytPlayer.onload = () => {
    try {
      const doc = ytPlayer.contentDocument || ytPlayer.contentWindow?.document;
      if (doc && (doc.title.includes('Error') || doc.body?.innerHTML?.includes('errorcode'))) {
        showEmbedError();
      }
    } catch(e) {
      // cross-origin — can't inspect, assume fine
    }
  };

  setTimeout(() => {
    try {
      const doc = ytPlayer.contentDocument || ytPlayer.contentWindow?.document;
      if (doc && doc.title && doc.title !== '') showEmbedError();
    } catch(e) {}
  }, 3000);
}

function showEmbedError() {
  ytPlayer.style.display = 'none';
  playerError.style.display = 'flex';
}

openYtBtn.addEventListener('click', () => {
  window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
});

backBtn.addEventListener('click', () => {
  playerSection.style.display = 'none';
  ytPlayer.src = '';
  playerError.style.display = 'none';
  ytPlayer.style.display = 'block';
  resultsEl.style.display = 'grid';
  document.getElementById('load-more-wrap').style.display = 'block';
});

searchBtn.addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (!q) return;
  currentQuery = q;
  playerSection.style.display = 'none';
  ytPlayer.src = '';
  resultsEl.style.display = 'grid';
  search(q);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchBtn.click();
});

loadMoreBtn.addEventListener('click', () => search(currentQuery, nextPageToken));
</script>
