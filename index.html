<script>
const API_KEY = 'AIzaSyAKQLUA2J7j1YOlmy93z-DIFOkJWPy_kBQ';

let nextPageToken = '';
let currentQuery = '';
let currentVideoId = '';

const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');
const resultsEl = document.getElementById('results');
const modeYoutubeBtn = document.getElementById('mode-youtube');
const modeEmbedBtn = document.getElementById('mode-embed');

let playbackMode = localStorage.getItem('focusTubePlaybackMode') || 'youtube';
const statusEl = document.getElementById('status');
const playerSection = document.getElementById('player-section');
const ytPlayer = document.getElementById('yt-player');
const playerError = document.getElementById('player-error');
const videoTitleEl = document.getElementById('video-title');
const backBtn = document.getElementById('back-btn');
const loadMoreBtn = document.getElementById('load-more');
const openYtBtn = document.getElementById('open-yt-btn');

const usernameInput = document.getElementById('username-input');
const signinBtn = document.getElementById('signin-btn');
const signoutBtn = document.getElementById('signout-btn');
const historyBtn = document.getElementById('history-btn');
const clearHistoryBtn = document.getElementById('clear-history-btn');
const signedOutEl = document.getElementById('signed-out');
const signedInEl = document.getElementById('signed-in');
const welcomeText = document.getElementById('welcome-text');
const historySection = document.getElementById('history-section');
const watchHistoryEl = document.getElementById('watch-history');
const searchHistoryEl = document.getElementById('search-history');


const STORAGE_KEYS = {
  user: 'cleanTubeUser',
  watchHistory: 'cleanTubeWatchHistory',
  searchHistory: 'cleanTubeSearchHistory'
};

  function extractYouTubeVideoId(input) {
  const value = input.trim();

  const patterns = [
    /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
    /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/
  ];

  for (const pattern of patterns) {
    const match = value.match(pattern);
    if (match) return match[1];
  }

  if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
    return value;
  }

  return null;
}

function openVideoFromInput(input) {
  const videoId = extractYouTubeVideoId(input);
  if (!videoId) return false;

  playVideo(
    videoId,
    'Direct video link',
    `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
    'Pasted link'
  );

  return true;
}

function escapeHTML(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function getStoredJSON(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch {
    return fallback;
  }
}

function setStoredJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function getCurrentUser() {
  return localStorage.getItem(STORAGE_KEYS.user);
}

function updateAuthUI() {
  const user = getCurrentUser();

  if (user) {
    signedOutEl.style.display = 'none';
    signedInEl.style.display = 'flex';
    welcomeText.textContent = `Signed in as ${user}`;
  } else {
    signedOutEl.style.display = 'flex';
    signedInEl.style.display = 'none';
    historySection.style.display = 'none';
  }
}

function signIn() {
  const name = usernameInput.value.trim();
  if (!name) return;

  localStorage.setItem(STORAGE_KEYS.user, name);
  usernameInput.value = '';
  updateAuthUI();
}

function signOut() {
  localStorage.removeItem(STORAGE_KEYS.user);
  updateAuthUI();
}

function addSearchHistory(query) {
  if (!getCurrentUser()) return;

  const history = getStoredJSON(STORAGE_KEYS.searchHistory, []);
  const cleaned = history.filter(item => item.query.toLowerCase() !== query.toLowerCase());

  cleaned.unshift({
    query,
    searchedAt: new Date().toISOString()
  });

  setStoredJSON(STORAGE_KEYS.searchHistory, cleaned.slice(0, 50));
}

function addWatchHistory(video) {
  if (!getCurrentUser()) return;

  const history = getStoredJSON(STORAGE_KEYS.watchHistory, []);
  const cleaned = history.filter(item => item.id !== video.id);

  cleaned.unshift({
    ...video,
    watchedAt: new Date().toISOString()
  });

  setStoredJSON(STORAGE_KEYS.watchHistory, cleaned.slice(0, 100));
}

function renderHistory() {
  const watchHistory = getStoredJSON(STORAGE_KEYS.watchHistory, []);
  const searchHistory = getStoredJSON(STORAGE_KEYS.searchHistory, []);

  if (!watchHistory.length) {
    watchHistoryEl.innerHTML = `<div class="history-empty">No watched videos yet.</div>`;
  } else {
    watchHistoryEl.innerHTML = `<div class="history-grid"></div>`;
    const grid = watchHistoryEl.querySelector('.history-grid');

    watchHistory.forEach(item => {
      const card = document.createElement('div');
      card.className = 'result-card';

      card.innerHTML = `
        <img src="${escapeHTML(item.thumb)}" alt="" loading="lazy">
        <div class="result-info">
          <div class="result-title">${escapeHTML(item.title)}</div>
          <div class="result-meta">${escapeHTML(item.channel || '')}</div>
        </div>
      `;

      card.addEventListener('click', () => {
        historySection.style.display = 'none';
        playVideo(item.id, item.title, item.thumb, item.channel);
      });

      grid.appendChild(card);
    });
  }

  if (!searchHistory.length) {
    searchHistoryEl.innerHTML = `<div class="history-empty">No searches yet.</div>`;
  } else {
    searchHistoryEl.innerHTML = '';
    searchHistory.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-search-item';
      div.textContent = item.query;

      div.addEventListener('click', () => {
        searchInput.value = item.query;
        historySection.style.display = 'none';
        currentQuery = item.query;
        playerSection.style.display = 'none';
        ytPlayer.src = '';
        resultsEl.style.display = 'grid';
        document.getElementById('load-more-wrap').style.display = 'block';
        search(item.query);
      });

      searchHistoryEl.appendChild(div);
    });
  }
}

function toggleHistory() {
  const showing = historySection.style.display === 'block';

  if (showing) {
    historySection.style.display = 'none';
    resultsEl.style.display = 'grid';
    return;
  }

  playerSection.style.display = 'none';
  ytPlayer.src = '';
  resultsEl.style.display = 'none';
  document.getElementById('load-more-wrap').style.display = 'none';

  renderHistory();
  historySection.style.display = 'block';
}

function clearHistory() {
  localStorage.removeItem(STORAGE_KEYS.watchHistory);
  localStorage.removeItem(STORAGE_KEYS.searchHistory);
  renderHistory();
}

function updatePlaybackModeUI() {
  modeYoutubeBtn.classList.toggle('active', playbackMode === 'youtube');
  modeEmbedBtn.classList.toggle('active', playbackMode === 'embed');
}

function setPlaybackMode(mode) {
  playbackMode = mode;
  localStorage.setItem('focusTubePlaybackMode', mode);
  updatePlaybackModeUI();
}

function openOnYouTube(id) {
  window.open(`https://www.youtube.com/watch?v=${id}`, '_blank');
}

async function search(query, pageToken = '') {
  statusEl.textContent = 'Searching...';
  historySection.style.display = 'none';

  if (!pageToken) {
    resultsEl.innerHTML = '';
    addSearchHistory(query);
  }

  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&order=relevance&q=${encodeURIComponent(query)}${pageToken ? '&pageToken=' + pageToken : ''}&key=${API_KEY}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      statusEl.textContent = 'API error: ' + data.error.message;
      return;
    }

    nextPageToken = data.nextPageToken || '';
    statusEl.textContent = '';
    renderResults(data.items || []);
    loadMoreBtn.style.display = nextPageToken ? 'inline-block' : 'none';
  } catch(e) {
    statusEl.textContent = 'Something went wrong.';
  }
}

function renderResults(items) {
  items.forEach(item => {
    const id = item.id.videoId;
    const title = item.snippet.title;
    const channel = item.snippet.channelTitle;
    const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url;

    const card = document.createElement('div');
    card.className = 'result-card';

    card.innerHTML = `
      <img src="${escapeHTML(thumb)}" alt="" loading="lazy">
      <div class="result-info">
        <div class="result-title">${escapeHTML(title)}</div>
        <div class="result-meta">${escapeHTML(channel)}</div>
      </div>
    `;

    card.addEventListener('click', () => playVideo(id, title, thumb, channel));
    resultsEl.appendChild(card);
  });
}

function playVideo(id, title, thumb = '', channel = '') {
  currentVideoId = id;

  addWatchHistory({
    id,
    title,
    thumb,
    channel
  });

  if (playbackMode === 'youtube') {
    openOnYouTube(id);
    return;
  }

  historySection.style.display = 'none';
  playerError.style.display = 'none';
  ytPlayer.style.display = 'block';
  ytPlayer.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
  videoTitleEl.textContent = title;
  playerSection.style.display = 'block';
  resultsEl.style.display = 'none';
  document.getElementById('load-more-wrap').style.display = 'none';
  statusEl.textContent = '';
  window.scrollTo(0, 0);

  ytPlayer.onload = () => {
    try {
      const doc = ytPlayer.contentDocument || ytPlayer.contentWindow?.document;
      if (doc && (doc.title.includes('Error') || doc.body?.innerHTML?.includes('errorcode'))) {
        showEmbedError();
      }
    } catch(e) {
      // cross-origin — can't inspect, assume fine
    }
  };
}

function showEmbedError() {
  ytPlayer.style.display = 'none';
  playerError.style.display = 'flex';
}

openYtBtn.addEventListener('click', () => {
  window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
});

backBtn.addEventListener('click', () => {
  playerSection.style.display = 'none';
  ytPlayer.src = '';
  playerError.style.display = 'none';
  ytPlayer.style.display = 'block';
  resultsEl.style.display = 'grid';
  document.getElementById('load-more-wrap').style.display = 'block';
});

searchBtn.addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (!q) return;

  const openedDirectVideo = openVideoFromInput(q);
  if (openedDirectVideo) return;

  currentQuery = q;
  playerSection.style.display = 'none';
  ytPlayer.src = '';
  resultsEl.style.display = 'grid';
  document.getElementById('load-more-wrap').style.display = 'block';
  search(q);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchBtn.click();
});

usernameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') signIn();
});

loadMoreBtn.addEventListener('click', () => search(currentQuery, nextPageToken));
signinBtn.addEventListener('click', signIn);
signoutBtn.addEventListener('click', signOut);
historyBtn.addEventListener('click', toggleHistory);
clearHistoryBtn.addEventListener('click', clearHistory);

modeYoutubeBtn.addEventListener('click', () => setPlaybackMode('youtube'));
modeEmbedBtn.addEventListener('click', () => setPlaybackMode('embed'));

updatePlaybackModeUI();
updateAuthUI();
</script>
</script>
